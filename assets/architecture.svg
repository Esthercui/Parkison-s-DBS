   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c40" x="19.8499" y="30.392308" transform="rotate(-0 19.8499 30.392308)">A benchmark with an evaluator-side ground truth</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #406681" x="19.8499" y="61.753846" transform="rotate(-0 19.8499 61.753846)">OFFLINE SETUP  /  measured separately from the search budget</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c40" x="31.622315" y="100.084615" transform="rotate(-0 31.622315 100.084615)">Define the feasible set</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(31.622315 130.125627)">Stage 1 / 2 grid; Stage 3 bits</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(31.622315 140.928087)">Stage 2 feasibility before simulation</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c40" x="239.370815" y="100.084615" transform="rotate(-0 239.370815 100.084615)">STN–GPe simulator</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(239.370815 130.125627)">Fixed model, no patient data</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(239.370815 140.928087)">Beta power normalized to baseline</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c40" x="447.119315" y="100.084615" transform="rotate(-0 447.119315 100.084615)">Build the objective</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(447.119315 130.125627)">Stages 1 / 2: beta + energy</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(447.119315 140.928087)">Stage 3: 41-point quadratic fit</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c40" x="654.867815" y="100.084615" transform="rotate(-0 654.867815 100.084615)">Enumerate the oracle</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(654.867815 130.125627)">Full finite feasible domain</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(654.867815 140.928087)">Optimum held by the evaluator</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #406681" x="19.8499" y="180.230769" transform="rotate(-0 19.8499 180.230769)">BUDGETED SEARCH  /  repeated with paired seeds 0–9</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c40" x="31.622315" y="225.530769" transform="rotate(-0 31.622315 225.530769)">Shared initialization</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(31.622315 255.57178)">5 charged observations</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(31.622315 266.374241)">No-stimulation control when allowed</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c40" x="239.370815" y="225.530769" transform="rotate(-0 239.370815 225.530769)">Six optimization methods</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(239.370815 255.57178)">Random, GA, BO, CMA-ES</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(239.370815 266.374241)">Exhaustive surrogate, QAOA p=1</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c40" x="447.119315" y="225.530769" transform="rotate(-0 447.119315 225.530769)">Scalar oracle access</text>
   </g>
   <g id="text_17">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(447.119315 255.57178)">Stop at 40 unique setting queries</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(447.119315 266.374241)">Cache repeated queries; keep a trace</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202c40" x="654.867815" y="225.530769" transform="rotate(-0 654.867815 225.530769)">Regret and seed variation</text>
   </g>
   <g id="text_19">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(654.867815 255.57178)">Best cost − finite-domain minimum</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(654.867815 266.374241)">Read prefixes at 10, 20, 30, 40</text>
   </g>
   <g id="text_20">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="23.312375" y="327.978462" transform="rotate(-0 23.312375 327.978462)">Resource ledger: simulator setup calls • objective queries • surrogate predictions • circuit executions • simulated shots • wall time</text>
   </g>
   <g id="text_21">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="23.312375" y="352.370769" transform="rotate(-0 23.312375 352.370769)">QAOA runs on a classical statevector simulator. Stage 3 queries evaluate a fitted QUBO. This is not a clinical treatment system.</text>
   </g>
  </g>
 </g>
